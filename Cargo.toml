[workspace]
members = ["mlx-lm-server", "mlx-audio-server", "mlx-image-server"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Ar9av/mlx-lm-server"
homepage = "https://github.com/Ar9av/mlx-lm-server"
rust-version = "1.75"

[workspace.dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.22", features = ["auto-initialize", "gil-refs"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
futures = "0.3"
thiserror = "1"
bytes = "1"
tempfile = "3"
base64 = "0.22"
